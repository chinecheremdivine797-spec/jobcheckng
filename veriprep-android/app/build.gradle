plugins { id 'com.android.application' }

android {
    namespace 'com.veriprep.global'
    compileSdk 35

    defaultConfig {
        applicationId 'com.veriprep.global'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            def ks = project.findProperty("RELEASE_STORE_FILE")
            def kp = project.findProperty("RELEASE_STORE_PASSWORD")
            def ka = project.findProperty("RELEASE_KEY_ALIAS")
            def keyp = project.findProperty("RELEASE_KEY_PASSWORD")
            if (ks && kp && ka && keyp) {
                storeFile file(ks)
                storePassword kp
                keyAlias ka
                keyPassword keyp
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
