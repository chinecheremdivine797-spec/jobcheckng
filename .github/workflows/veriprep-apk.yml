name: Build VeriPrep Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'veriprep-android/**'
      - '.github/workflows/veriprep-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veriprep-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create temporary release keystore
        run: |
          keytool -genkeypair -v \
            -keystore veriprep-release.keystore \
            -storepass "${{ runner.temp }}" \
            -alias veriprep \
            -keypass "${{ runner.temp }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VeriPrep Global, OU=VeriPrep, O=VeriPrep Global, C=NG"

      - name: Build signed release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../veriprep-release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ runner.temp }}" \
            -PRELEASE_KEY_ALIAS=veriprep \
            -PRELEASE_KEY_PASSWORD="${{ runner.temp }}"

      - name: Verify signed APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk VeriPrep-Global.apk
          ls -lh VeriPrep-Global.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: VeriPrep-Global
          path: veriprep-android/VeriPrep-Global.apk
          if-no-files-found: error
